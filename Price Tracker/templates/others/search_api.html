{% if products %}
<div class="row g-4">
    {% for p in products %}
    <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm border-0">
            <img src="{{ p['image_url'] or '/static/images/placeholder.png' }}"
                 class="card-img-top p-3"
                 style="height: 180px; object-fit: contain;"
                 alt="{{ p['product'] }}">
            <div class="card-body d-flex flex-column">
                <h6 class="fw-semibold mb-2" style="min-height: 48px;">
                    {{ p['product'] }}
                </h6>
                <span class="badge text-bg-primary mb-3 w-fit bi-cart4">
                    FLIPKART
                </span>
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Price</span>
                        <span class="fw-bold">₹{{ p['price'] }}</span>
                    </div>
                    {% if p.get('mrp') %}
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">MRP</span>
                        <span class="text-decoration-line-through text-muted">
                            ₹{{ p['mrp'] }}
                        </span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Saved</span>
                        <span class="text-success fw-semibold">
                            ₹{{ p['mrp'] - p['price'] }}
                        </span>
                    </div>
                    {% endif %}
                </div>
                {% if user %}
                <button class="btn btn-warning w-100 fw-semibold bi-bag-plus"
                        hx-post="/products"
                        hx-vals='{"name": {{ p["product"]|tojson }}, "data_id": {{ p["data_id"]|tojson }}, "search_q": {{ query|tojson }}}'
                        hx-ext="json-enc"
                        hx-swap="none"
                        data-name="{{ p['product'] }}"
                        data-id="{{ p['data_id'] }}">
                    Track This
                </button>
                {% else %}
                <a class="btn btn-warning w-100 fw-semibold login-prompt-btn bi-lock"
                        tabindex="0"
                        role="button"
                        data-bs-toggle="popover"
                        data-bs-trigger="focus"
                        data-bs-placement="top"
                        data-bs-title="Login Required"
                        data-bs-content="Please login to track product prices.">
                    Track This
                </a>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center text-muted py-5 bi-bricks">
    No results found.
</div>
{% endif %}

<script>
document.querySelectorAll('.login-prompt-btn').forEach(btn => {
    new bootstrap.Popover(btn, {
        trigger: 'focus'
    });

    btn.addEventListener('click', function (e) {
        e.preventDefault();
    });
});
</script>
